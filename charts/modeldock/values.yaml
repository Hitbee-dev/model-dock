global:
  production: false
  imagePullPolicy: IfNotPresent
  storageClassName: ""

urls:
  publicSiteUrl: https://modeldock.example.com
  publicAppUrl: https://app.modeldock.example.com
  publicApiUrl: https://api.modeldock.example.com
  adminAppUrl: https://admin-random.modeldock.example.com
  trustedOrigins: https://modeldock.example.com,https://app.modeldock.example.com

workloads:
  web:
    enabled: true
    replicaCount: 1
    image:
      repository: ghcr.io/modeldock/web
      tag: "0.0.0"
    port: 3000
    secretEnv: false
  admin:
    enabled: true
    replicaCount: 1
    image:
      repository: ghcr.io/modeldock/admin
      tag: "0.0.0"
    port: 3001
    secretEnv: true
  api:
    enabled: true
    replicaCount: 1
    image:
      repository: ghcr.io/modeldock/api
      tag: "0.0.0"
    port: 3002
    secretEnv: true

litellm:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/berriai/litellm
    tag: v1.80.5-stable
  port: 4000
  podSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

service:
  type: ClusterIP

ingress:
  enabled: false
  className: ""
  annotations: {}
  tls: []
  hosts:
    web:
      host: app.modeldock.example.com
      path: /
    api:
      host: api.modeldock.example.com
      path: /
    admin:
      host: admin-random.modeldock.example.com
      path: /

config:
  nodeEnv: development
  accessMode: debug
  adminAllowedIps: ""
  adminAllowedMacs: ""
  adminAutoAllowHostNetwork: "false"
  trustedProxyIps: ""
  debugAdminEmail: admin
  publicRegistrationEnabled: "false"
  adminBootstrapEnabled: "false"
  logChatContent: "false"
  defaultUserCreditsUsd: "5"
  defaultBudgetDuration: 30d
  experimentalSubscriptionOauth: "false"
  experimentalChatgptSubscription: "false"
  experimentalClaudeSubscription: "false"
  cloudflareAccessEnabled: "false"
  cloudflareAccessTeamDomain: team.cloudflareaccess.com
  cloudflareAccessAllowedAudiences: replace-with-cloudflare-access-audience
  cloudflareAccessAllowedEmails: owner@example.com
  weaviateUrl: ""
  s3Endpoint: ""
  s3Region: us-east-1
  s3Bucket: modeldock

secrets:
  existingSecret: ""
  databaseUrl: ""
  litellmDatabaseUrl: ""
  redisUrl: ""
  postgresPassword: replace-with-db-password
  redisPassword: replace-with-redis-password
  weaviateApiKey: replace-with-weaviate-app-key
  weaviateRootApiKey: replace-with-weaviate-root-key
  s3AccessKeyId: replace-with-s3-access-key
  s3SecretAccessKey: replace-with-s3-secret-key
  sessionSecret: replace-with-strong-random-session-secret
  credentialEncryptionKey: replace-with-strong-random-32-byte-key
  credentialEncryptionKeyId: default-v1
  ownerBootstrapToken: replace-with-one-time-local-bootstrap-token
  adminApiToken: replace-with-strong-admin-api-token
  debugAdminPassword: replace-with-debug-admin-password
  litellmMasterKey: replace-with-strong-litellm-master-key
  openaiApiKey: ""
  anthropicApiKey: ""
  geminiApiKey: ""
  openrouterApiKey: ""

allInOne:
  enabled: false
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
  postgres:
    enabled: true
    image:
      repository: postgres
      tag: 16-alpine
    port: 5432
    database: modeldock
    litellmDatabase: litellm
    username: modeldock
    storage:
      size: 2Gi
  redis:
    enabled: true
    image:
      repository: redis
      tag: 8.6.2-alpine
    port: 6379
    storage:
      size: 1Gi
  weaviate:
    enabled: true
    image:
      repository: cr.weaviate.io/semitechnologies/weaviate
      tag: 1.37.0
    port: 8080
    grpcPort: 50051
    storage:
      size: 4Gi
  objectstore:
    enabled: true
    image:
      repository: chrislusf/seaweedfs
      tag: "3.85"
    port: 8333
    storage:
      size: 4Gi

resources: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
