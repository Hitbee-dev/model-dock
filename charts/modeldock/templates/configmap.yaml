{{- include "modeldock.requireProductionUrl" (list . "urls.publicSiteUrl" .Values.urls.publicSiteUrl) -}}
{{- include "modeldock.requireProductionUrl" (list . "urls.publicAppUrl" .Values.urls.publicAppUrl) -}}
{{- include "modeldock.requireProductionUrl" (list . "urls.publicApiUrl" .Values.urls.publicApiUrl) -}}
{{- include "modeldock.requireProductionUrl" (list . "urls.adminAppUrl" .Values.urls.adminAppUrl) -}}
{{- include "modeldock.requireProductionUrl" (list . "urls.trustedOrigins" .Values.urls.trustedOrigins) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "modeldock.fullname" . }}-config
  labels:
    {{- include "modeldock.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ ternary "production" .Values.config.nodeEnv .Values.global.production | quote }}
  MODELDOCK_ACCESS_MODE: {{ ternary "release" .Values.config.accessMode .Values.global.production | quote }}
  PUBLIC_SITE_URL: {{ .Values.urls.publicSiteUrl | quote }}
  PUBLIC_APP_URL: {{ .Values.urls.publicAppUrl | quote }}
  PUBLIC_API_URL: {{ .Values.urls.publicApiUrl | quote }}
  SERVER_API_URL: "http://{{ include "modeldock.fullname" . }}-api:{{ (index .Values.workloads "api").port }}"
  ADMIN_APP_URL: {{ .Values.urls.adminAppUrl | quote }}
  TRUSTED_ORIGINS: {{ .Values.urls.trustedOrigins | quote }}
  ADMIN_ALLOWED_IPS: {{ .Values.config.adminAllowedIps | quote }}
  ADMIN_ALLOWED_MACS: {{ .Values.config.adminAllowedMacs | quote }}
  ADMIN_AUTO_ALLOW_HOST_NETWORK: {{ .Values.config.adminAutoAllowHostNetwork | quote }}
  TRUSTED_PROXY_IPS: {{ .Values.config.trustedProxyIps | quote }}
  MODELDOCK_DEBUG_ADMIN_EMAIL: {{ .Values.config.debugAdminEmail | quote }}
  PUBLIC_REGISTRATION_ENABLED: {{ .Values.config.publicRegistrationEnabled | quote }}
  ADMIN_BOOTSTRAP_ENABLED: {{ .Values.config.adminBootstrapEnabled | quote }}
  LOG_CHAT_CONTENT: {{ .Values.config.logChatContent | quote }}
  DEFAULT_USER_CREDITS_USD: {{ .Values.config.defaultUserCreditsUsd | quote }}
  DEFAULT_BUDGET_DURATION: {{ .Values.config.defaultBudgetDuration | quote }}
  EXPERIMENTAL_SUBSCRIPTION_OAUTH: {{ .Values.config.experimentalSubscriptionOauth | quote }}
  EXPERIMENTAL_CHATGPT_SUBSCRIPTION: {{ .Values.config.experimentalChatgptSubscription | quote }}
  EXPERIMENTAL_CLAUDE_SUBSCRIPTION: {{ .Values.config.experimentalClaudeSubscription | quote }}
  MODELDOCK_CODEX_COMMAND: {{ .Values.config.modeldockCodexCommand | quote }}
  MODELDOCK_CLAUDE_COMMAND: {{ .Values.config.modeldockClaudeCommand | quote }}
  MODELDOCK_RUNTIME_WORKDIR: {{ .Values.config.modeldockRuntimeWorkdir | quote }}
  CLOUDFLARE_ACCESS_ENABLED: {{ .Values.config.cloudflareAccessEnabled | quote }}
  CLOUDFLARE_ACCESS_TEAM_DOMAIN: {{ .Values.config.cloudflareAccessTeamDomain | quote }}
  CLOUDFLARE_ACCESS_ALLOWED_AUDIENCES: {{ .Values.config.cloudflareAccessAllowedAudiences | quote }}
  CLOUDFLARE_ACCESS_ALLOWED_EMAILS: {{ .Values.config.cloudflareAccessAllowedEmails | quote }}
  LITELLM_BASE_URL: "http://{{ include "modeldock.fullname" . }}-litellm:{{ .Values.litellm.port }}"
  WEAVIATE_URL: {{ include "modeldock.weaviateUrl" . | quote }}
  S3_ENDPOINT: {{ include "modeldock.s3Endpoint" . | quote }}
  S3_REGION: {{ .Values.config.s3Region | quote }}
  S3_BUCKET: {{ .Values.config.s3Bucket | quote }}
