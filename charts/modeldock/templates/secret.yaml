{{- if not .Values.secrets.existingSecret -}}
{{- include "modeldock.requireProductionSecret" (list . "secrets.databaseUrl" .Values.secrets.databaseUrl) -}}
{{- include "modeldock.requireProductionSecret" (list . "secrets.redisUrl" .Values.secrets.redisUrl) -}}
{{- include "modeldock.requireProductionSecret" (list . "secrets.weaviateApiKey" .Values.secrets.weaviateApiKey) -}}
{{- include "modeldock.requireProductionSecret" (list . "secrets.s3AccessKeyId" .Values.secrets.s3AccessKeyId) -}}
{{- include "modeldock.requireProductionSecret" (list . "secrets.s3SecretAccessKey" .Values.secrets.s3SecretAccessKey) -}}
{{- include "modeldock.requireProductionSecret" (list . "secrets.sessionSecret" .Values.secrets.sessionSecret) -}}
{{- include "modeldock.requireProductionSecret" (list . "secrets.credentialEncryptionKey" .Values.secrets.credentialEncryptionKey) -}}
{{- include "modeldock.requireProductionSecret" (list . "secrets.ownerBootstrapToken" .Values.secrets.ownerBootstrapToken) -}}
{{- include "modeldock.requireProductionSecret" (list . "secrets.adminApiToken" .Values.secrets.adminApiToken) -}}
{{- include "modeldock.requireProductionSecret" (list . "secrets.litellmMasterKey" .Values.secrets.litellmMasterKey) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "modeldock.secretName" . }}
  labels:
    {{- include "modeldock.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  WEAVIATE_API_KEY: {{ .Values.secrets.weaviateApiKey | quote }}
  S3_ACCESS_KEY_ID: {{ .Values.secrets.s3AccessKeyId | quote }}
  S3_SECRET_ACCESS_KEY: {{ .Values.secrets.s3SecretAccessKey | quote }}
  SESSION_SECRET: {{ .Values.secrets.sessionSecret | quote }}
  CREDENTIAL_ENCRYPTION_KEY: {{ .Values.secrets.credentialEncryptionKey | quote }}
  CREDENTIAL_ENCRYPTION_KEY_ID: {{ .Values.secrets.credentialEncryptionKeyId | quote }}
  OWNER_BOOTSTRAP_TOKEN: {{ .Values.secrets.ownerBootstrapToken | quote }}
  ADMIN_API_TOKEN: {{ .Values.secrets.adminApiToken | quote }}
  LITELLM_MASTER_KEY: {{ .Values.secrets.litellmMasterKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  OPENROUTER_API_KEY: {{ .Values.secrets.openrouterApiKey | quote }}
{{- end -}}
