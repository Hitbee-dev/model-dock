{{- if and .Values.allInOne.enabled .Values.allInOne.postgres.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "modeldock.postgresName" . }}-init
  labels:
    {{- include "modeldock.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
data:
  10-modeldock-databases.sh: |
    set -e
    : "${POSTGRES_USER:={{ .Values.allInOne.postgres.username }}}"
    : "${LITELLM_POSTGRES_DB:={{ .Values.allInOne.postgres.litellmDatabase }}}"

    psql -v ON_ERROR_STOP=1 \
      --username "$POSTGRES_USER" \
      --dbname postgres \
      -v litellm_db="$LITELLM_POSTGRES_DB" \
      -v owner="$POSTGRES_USER" <<-'EOSQL'
      SELECT format('CREATE DATABASE %I', :'litellm_db')
      WHERE NOT EXISTS (
        SELECT FROM pg_database WHERE datname = :'litellm_db'
      )\gexec
      GRANT ALL PRIVILEGES ON DATABASE :"litellm_db" TO :"owner";
    EOSQL
{{- end }}
