{{- if .Values.litellm.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "modeldock.fullname" . }}-litellm
  labels:
    {{- include "modeldock.labels" . | nindent 4 }}
    app.kubernetes.io/component: litellm
spec:
  replicas: {{ .Values.litellm.replicaCount }}
  selector:
    matchLabels:
      {{- include "modeldock.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: litellm
  template:
    metadata:
      labels:
        {{- include "modeldock.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: litellm
    spec:
      securityContext:
        {{- toYaml .Values.litellm.podSecurityContext | nindent 8 }}
      {{- if and .Values.allInOne.enabled .Values.allInOne.postgres.enabled }}
      initContainers:
        - name: litellm-database-bootstrap
          image: "{{ .Values.allInOne.postgres.image.repository }}:{{ .Values.allInOne.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - sh
            - /bootstrap/10-modeldock-databases.sh
          env:
            - name: PGHOST
              value: {{ include "modeldock.postgresName" . | quote }}
            - name: PGPORT
              value: {{ .Values.allInOne.postgres.port | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.allInOne.postgres.username | quote }}
            - name: LITELLM_POSTGRES_DB
              value: {{ .Values.allInOne.postgres.litellmDatabase | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "modeldock.secretName" . }}
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-init
              mountPath: /bootstrap
              readOnly: true
      {{- end }}
      containers:
        - name: litellm
          image: "{{ .Values.litellm.image.repository }}:{{ .Values.litellm.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - --config
            - /app/config.yaml
            - --host
            - 0.0.0.0
            - --port
            - {{ .Values.litellm.port | quote }}
          securityContext:
            {{- toYaml .Values.litellm.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.litellm.port }}
          envFrom:
            - secretRef:
                name: {{ include "modeldock.secretName" . }}
          volumeMounts:
            - name: litellm-config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: litellm-config
          configMap:
            name: {{ include "modeldock.fullname" . }}-litellm-config
        {{- if and .Values.allInOne.enabled .Values.allInOne.postgres.enabled }}
        - name: postgres-init
          configMap:
            name: {{ include "modeldock.postgresName" . }}-init
            defaultMode: 0755
        {{- end }}
{{- end }}
