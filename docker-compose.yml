services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-modeldock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-local-db-password}
      POSTGRES_DB: ${POSTGRES_DB:-modeldock}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:${REDIS_VERSION:-8.6.2-alpine}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-replace-with-local-redis-password}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-replace-with-local-redis-password} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "6379"

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:${WEAVIATE_VERSION:-1.37.0}
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    environment:
      QUERY_DEFAULTS_LIMIT: "20"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_ROOT_API_KEY:-replace-with-local-weaviate-root-key},${WEAVIATE_API_KEY:-replace-with-local-weaviate-app-key}
      AUTHENTICATION_APIKEY_USERS: root,modeldock_app
      AUTHORIZATION_ENABLE_RBAC: "true"
      AUTHORIZATION_RBAC_ROOT_USERS: root
      CLUSTER_HOSTNAME: node1
      DISABLE_TELEMETRY: "true"
    volumes:
      - weaviate-data:/var/lib/weaviate
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "8080"
      - "50051"

  objectstore:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-3.85}
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -volume.max=0
      - -master.volumeSizeLimitMB=1024
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-replace-with-local-s3-access-key}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-replace-with-local-s3-secret-key}
    volumes:
      - objectstore-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8333/"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "8333"

  litellm:
    image: ghcr.io/berriai/litellm:${LITELLM_VERSION:-v1.57.8}
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-replace-with-strong-litellm-master-key}
      DATABASE_URL: ${DATABASE_URL:-postgresql://modeldock:replace-with-local-db-password@postgres:5432/modeldock}
      STORE_MODEL_IN_DB: "True"
      UI_USERNAME: disabled
      UI_PASSWORD: disabled
    volumes:
      - ./docker/litellm.config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "4000"

  web:
    build:
      context: .
      dockerfile: docker/node-app.Dockerfile
      args:
        APP_PATH: apps/web
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://127.0.0.1:3000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://127.0.0.1:3002}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: docker/node-app.Dockerfile
      args:
        APP_PATH: apps/admin
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      ADMIN_APP_URL: ${ADMIN_APP_URL:-http://127.0.0.1:3001}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: docker/node-app.Dockerfile
      args:
        APP_PATH: apps/api
    environment:
      HOST: 0.0.0.0
      PORT: 3002
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://modeldock:replace-with-local-db-password@postgres:5432/modeldock}
      REDIS_URL: ${REDIS_URL:-redis://:replace-with-local-redis-password@redis:6379/0}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      WEAVIATE_URL: ${WEAVIATE_URL:-http://weaviate:8080}
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY:-replace-with-local-weaviate-app-key}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://objectstore:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-modeldock-local}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-replace-with-local-s3-access-key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-replace-with-local-s3-secret-key}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-replace-with-strong-litellm-master-key}
      PUBLIC_REGISTRATION_ENABLED: ${PUBLIC_REGISTRATION_ENABLED:-false}
      LOG_CHAT_CONTENT: ${LOG_CHAT_CONTENT:-false}
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      objectstore:
        condition: service_healthy
      litellm:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  weaviate-data:
  objectstore-data:
